name: Monarch weather check

on:
  schedule:
    - cron: "5 15 * 9,10 *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python check_weather.py
